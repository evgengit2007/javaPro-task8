server:
  servlet:
    context-path: "/v1/api/payments"
  port: 8991

spring:
  application:
    name: limit-core
  datasource:
    url: jdbc:postgresql://localhost:5432/limitsjavapro
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none

service:
  limits:
    default:
      amount: 10000
      update-limit: 0 0 0 * * *
